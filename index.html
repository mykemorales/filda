<style>
/* Single arctic world: soft clay toy on a pale-blue slope; UI as frosted chips + one beak-orange button */
:root{
  --sky:#cfe8f3;
  --ink:#16324a;
  --frost:rgba(246,251,253,.93);
  --beak:#f4a81d;
  --beak-deep:#c47c0a;
  --deep:#0e2a40;
  --muted:#4d6a80;
  --display:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{
  margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);
  touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.hud{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;gap:8px;pointer-events:none;
}
.chip{
  background:var(--frost);border-radius:999px;padding:7px 14px;
  font-family:var(--display);font-weight:600;font-size:18px;
  font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(22,50,74,.14);
  display:flex;align-items:baseline;gap:6px;
}
.chip small{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);
  background:var(--frost);border-radius:999px;padding:8px 16px;font-weight:800;font-size:13px;
  white-space:nowrap;pointer-events:none;transition:opacity .6s;
}
.overlay{
  position:fixed;inset:0;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(14,42,64,0) 30%,rgba(14,42,64,.38));
}
#start{place-items:end center;padding-block-end:calc(env(safe-area-inset-bottom,0px) + 20px);background:linear-gradient(180deg,rgba(14,42,64,0) 55%,rgba(14,42,64,.3))}
#start .card{gap:10px;padding:18px 20px}
#start h1{font-size:44px}
.card{
  background:var(--frost);border-radius:24px;padding:26px 22px 22px;width:100%;max-width:340px;
  text-align:center;box-shadow:0 12px 34px rgba(14,42,64,.25);display:grid;gap:14px;
}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--display);margin:0;line-height:1;text-wrap:balance}
h1{font-size:56px;font-weight:700;letter-spacing:.01em}
h2{font-size:40px;font-weight:700}
.how{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-weight:600;font-size:15px;color:var(--ink)}
.how b{font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:grid;gap:2px}
.stat span{font-family:var(--display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums}
.stat small{font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button.go{
  font-family:var(--display);font-size:22px;font-weight:600;border:0;border-radius:16px;
  padding:14px 28px;background:var(--beak);color:#3a2300;box-shadow:0 4px 0 var(--beak-deep);
  cursor:pointer;touch-action:manipulation;
}
button.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--beak-deep)}
button.go:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.new{color:#b8640a;font-weight:800;font-size:14px}
.row{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
button.soft{
  font-family:var(--display);font-size:20px;font-weight:600;border:0;border-radius:16px;
  padding:12px 18px;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(22,50,74,.22),inset 0 0 0 2px rgba(22,50,74,.12);
  cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
button.soft:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(22,50,74,.22),inset 0 0 0 2px rgba(22,50,74,.12)}
button.soft:focus-visible,button.back:focus-visible,.skin:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.homeBest{font-weight:800;font-size:14px;color:var(--muted)}
.homeBest b{color:var(--ink);font-family:var(--display);font-weight:600;font-size:17px}
#shop{place-items:end center;padding-block-end:calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(180deg,rgba(14,42,64,0) 50%,rgba(14,42,64,.3))}
.shopCard{max-width:380px;gap:12px;padding:14px 16px 18px}
.shopTop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.shopTop .back{justify-self:start}
.bank{justify-self:end;display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:5px 10px 5px 8px;
  font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 2px rgba(22,50,74,.12)}
.bank.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.18)}}
.fi{width:18px;height:11px;flex:none;display:inline-block;vertical-align:-1px}
.price{display:inline-flex;align-items:center;gap:3px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:0;text-transform:none;color:#b8640a}
.price .fi{width:15px;height:9px}
.skin.locked .mini,.skin.locked svg:not(.fi){opacity:.55}
.skin.locked[aria-checked="true"] .mini,.skin.locked[aria-checked="true"] svg:not(.fi){opacity:1}
button.go.cant{background:#d7e1e8;color:var(--muted);box-shadow:0 4px 0 #b4c3ce;cursor:default}
button.go.cant:active{transform:none;box-shadow:0 4px 0 #b4c3ce}
.homeStats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.homeStats span{display:inline-flex;align-items:center;gap:5px}
.youHave{font-weight:800;font-size:13px;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:5px}
.youHave b{color:var(--ink);font-family:var(--display);font-weight:600;font-size:16px}
@media (prefers-reduced-motion:reduce){.bank.pop{animation:none}}
.shopTop h2{font-size:32px}
button.back{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
button.back:active{background:rgba(22,50,74,.08)}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{
  border:0;border-radius:16px;background:#fff;padding:12px 4px 10px;cursor:pointer;touch-action:manipulation;
  display:grid;justify-items:center;gap:6px;color:var(--ink);font-family:var(--body);
  box-shadow:inset 0 0 0 2px rgba(22,50,74,.12);transition:box-shadow .15s,transform .15s;
}
.skin:active{transform:scale(.96)}
.skin[aria-checked="true"]{box-shadow:inset 0 0 0 3px var(--beak),0 3px 0 var(--beak-deep);background:#fff8ea}
.skin .nm{font-family:var(--display);font-weight:600;font-size:18px;line-height:1}
.skin .tag{font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-height:12px}
.skin[aria-checked="true"] .tag{color:#b8640a}
/* tiny blocky penguin, same build as the 3D one */
.hats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.skin.hat{padding:8px 2px 8px;gap:4px;border-radius:14px}
.skin.hat svg:not(.fi){width:40px;height:40px;display:block}
.hats .skin{min-width:0}
.skins .skin{min-width:0}
.skin.hat .nm{font-size:13px;white-space:nowrap}
.skin.hat .tag{min-height:13px}
.mini{position:relative;width:46px;height:58px}
.mini i{position:absolute;display:block}
.mini .hd{left:17px;top:0;width:12px;height:16px;border-radius:6px 6px 3px 3px;background:var(--w);overflow:hidden}
.mini .hd::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--c)}
.mini .hd::after{content:"";position:absolute;left:3px;top:10px;width:6px;height:3px;background:var(--b);clip-path:polygon(0 0,100% 0,50% 100%)}
.mini .bd{left:6px;top:13px;width:34px;height:31px;border-radius:3px;background:var(--t);box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.mini .ov{left:13px;top:18px;width:20px;height:22px;border-radius:50%;background:var(--o)}
.mini .ar{top:16px;width:4px;height:28px;border-radius:2px;background:var(--a)}
.mini .ar.l{left:2px;transform:rotate(14deg)}.mini .ar.r{right:2px;transform:rotate(-14deg)}
.mini .lg{top:43px;width:10px;height:15px;border-radius:0 0 2px 2px}
.mini .lg.l{left:9px;background:linear-gradient(90deg,var(--lo) 50%,var(--li) 50%)}
.mini .lg.r{right:9px;background:linear-gradient(90deg,var(--li) 50%,var(--lo) 50%)}
.mini .lg,.mini .bd,.mini .hd{outline:1px solid rgba(22,50,74,.1)}
.musicBtn{
  position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  width:44px;height:44px;border:0;border-radius:50%;background:var(--frost);color:var(--ink);
  display:grid;place-items:center;box-shadow:0 2px 0 rgba(22,50,74,.14);cursor:pointer;z-index:5;padding:0;
}
.musicBtn .off{display:none}
.musicBtn[aria-pressed="false"] .on{display:none}
.musicBtn[aria-pressed="false"] .off{display:block}
.credit{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>

<div id="game" aria-label="Go Filda game"></div>

<div class="hud" id="hud" hidden>
  <div class="chip"><span id="dist">0</span><small>m</small></div>

  <svg class="on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 17V5l11-2v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="17" r="2.6" fill="currentColor"/><circle cx="17.5" cy="15" r="2.6" fill="currentColor"/></svg>
  <svg class="off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 17V5l11-2v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" opacity=".45"/><circle cx="6.5" cy="17" r="2.6" fill="currentColor" opacity=".45"/><circle cx="17.5" cy="15" r="2.6" fill="currentColor" opacity=".45"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
</button>

<!-- HOME -->
<div class="overlay" id="start">
  <div class="card">
    <div class="eyebrow">An endless ice slide</div>
    <h1>Go Filda</h1>
    <div class="homeBest homeStats" id="homeBest" hidden><span id="homeBestRun">Best run <b id="homeBestN">0</b> m</span><span id="homeBankWrap"><svg class="fi" viewBox="0 0 24 14" aria-hidden="true"><path d="M1.5 7C4.5 1.8 11.5.8 16.5 4.6L22 .8v12.4l-5.5-3.8C11.5 13.2 4.5 12.2 1.5 7Z" fill="#4f9fd3"/><circle cx="6.6" cy="6" r="1.3" fill="#16324a"/></svg><b id="homeBank">0</b> fish</span></div>

        Shop

</div>

<div class="overlay" id="shop" hidden>
  <div class="card shopCard">
    <div class="shopTop">
      <button class="back" id="shopBack" type="button" aria-label="Back to home">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <button class="go" id="againBtn" type="button">Keep sliding</button>
    <button class="soft" id="homeBtn" type="button">Home</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script>
(function(){
'use strict';
const LANES=[-2.2,0,2.2];
const BASE_Y=0.41;
const STAND_Y=1.375;
const ease=x=>x*x*(3-2*x);
const $=id=>document.getElementById(id);

/* ---------- renderer / scene ---------- */
const host=$('game');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const SKY=0xcfe8f3;
const scene=new THREE.Scene();
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,32,98);

const camera=new THREE.PerspectiveCamera(55,1,0.1,220);
let camBase={y:4.5,z:8,ly:0.8,lz:-8};
function resize(){
  const w=host.clientWidth||window.innerWidth,h=host.clientHeight||window.innerHeight;
  renderer.setSize(w,h,false);
  const a=w/h;camera.aspect=a;
  if(a<0.8){camera.fov=66;camBase={y:6.4,z:11.5,ly:0.4,lz:-6};}
  else{camera.fov=55;camBase={y:4.6,z:8.2,ly:0.8,lz:-8};}
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
resize();

scene.add(new THREE.HemisphereLight(0xeaf7ff,0x9dbfcf,0.9));
const sun=new THREE.DirectionalLight(0xfff1dc,0.85);
sun.position.set(7,14,8);
sun.target.position.set(0,0,-6);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:26,bottom:-26,near:1,far:60});
sun.shadow.bias=-0.0008;sun.shadow.normalBias=0.03;
scene.add(sun,sun.target);

/* ---------- materials ---------- */
const M={
  white:new THREE.MeshStandardMaterial({color:0xefebe6,roughness:.85}),
  black:new THREE.MeshStandardMaterial({color:0x1c1c1f,roughness:.7}),
  beak:new THREE.MeshStandardMaterial({color:0xf4a81d,roughness:.45}),
  snow:new THREE.MeshStandardMaterial({color:0xf7fbfd,roughness:.95}),
  ice:new THREE.MeshStandardMaterial({color:0x9edcf0,roughness:.15,transparent:true,opacity:.9}),
  iceDeep:new THREE.MeshStandardMaterial({color:0x6fc3e0,roughness:.2,transparent:true,opacity:.92}),
  seal:new THREE.MeshStandardMaterial({color:0x8995a2,roughness:.6}),
  coal:new THREE.MeshStandardMaterial({color:0x222226,roughness:.9}),
  carrot:new THREE.MeshStandardMaterial({color:0xf07a1a,roughness:.6}),
  fish:new THREE.MeshStandardMaterial({color:0x4f9fd3,roughness:.35,metalness:.2,emissive:0x0d2c44,emissiveIntensity:.35}),
  fishBelly:new THREE.MeshStandardMaterial({color:0xd9eef8,roughness:.4}),
};

/* ---------- skins: same build as Filda, different colours per part ---------- */
const WHITE=0xefebe6,BLACK=0x1c1c1f;
const SKINS={
  filda:{name:'Filda',tag:'The original',head:WHITE,cap:BLACK,beak:0xf4a81d,torso:WHITE,arms:BLACK,legIn:WHITE,legOut:WHITE,oval:null},
  beba:{name:'Beba',tag:'Green belly',head:WHITE,cap:WHITE,beak:0xd93a2b,torso:WHITE,arms:BLACK,legIn:0x2f6fd1,legOut:0x2f6fd1,oval:0x3fae4a},
  dyda:{name:'Dyda',tag:'Sunny legs',head:WHITE,cap:WHITE,beak:0xea5a0c,torso:BLACK,arms:BLACK,legIn:0xf28a1e,legOut:0xf7cf2a,oval:null},
};
const P={};
['head','cap','beak','torso','arms','legIn','legOut','oval'].forEach(k=>{
  P[k]=new THREE.MeshStandardMaterial({roughness:k==='beak'?.45:k==='arms'||k==='cap'?.7:.85});
});
P.eye=new THREE.MeshStandardMaterial({color:BLACK,roughness:.5});
/* ---------- saved in this browser: fish bank + what's been bought ---------- */
const PRICE={'skin:beba':410,'skin:dyda':410,'hat:tophat':240,'hat:bunny':240,'hat:alien':240,'hat:pumpkin':240};
let bank=0;try{bank=Math.max(0,parseInt(localStorage.getItem('filda-fish-bank'),10)||0);}catch(e){}
const owned=new Set(['skin:filda','hat:none']);
try{(JSON.parse(localStorage.getItem('filda-owned')||'[]')||[]).forEach(k=>owned.add(k));}catch(e){}
const isOwned=k=>owned.has(k)||!PRICE[k];
function saveBank(){try{localStorage.setItem('filda-fish-bank',String(bank));}catch(e){}}
function saveOwned(){try{localStorage.setItem('filda-owned',JSON.stringify([...owned]));}catch(e){}}
let skin='filda';try{const s=localStorage.getItem('filda-skin');if(SKINS[s]&&isOwned('skin:'+s))skin=s;}catch(e){}
let ovalMesh=null,solidLegs=[],splitLegs=[];
function applySkin(id){
  const k=SKINS[id];
  ['head','cap','beak','torso','arms','legIn','legOut'].forEach(p=>P[p].color.setHex(k[p]));
  if(k.oval!=null)P.oval.color.setHex(k.oval);
  if(ovalMesh)ovalMesh.visible=k.oval!=null;
  // only two-tone legs are built from halves; single-colour legs are one solid piece (no seam)
  const split=k.legIn!==k.legOut;
  solidLegs.forEach(m=>m.visible=!split);splitLegs.forEach(m=>m.visible=split);
}
applySkin(skin);

function rrShape(w,h,r){
  const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;
}
function rbox(w,h,d,b){
  const g=new THREE.ExtrudeGeometry(rrShape(w-2*b,h-2*b,b*.6),
    {depth:d-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:5});
  g.center();return g;
}
function mesh(g,m,shadow=true){const o=new THREE.Mesh(g,m);o.castShadow=shadow;o.receiveShadow=true;return o;}

function snowTexture(){
  const c=document.createElement('canvas');c.width=c.height=256;
  const x=c.getContext('2d');
  x.fillStyle='#eef6fa';x.fillRect(0,0,256,256);
  for(let i=0;i<260;i++){
    x.fillStyle=Math.random()<.5?'rgba(255,255,255,.9)':'rgba(196,222,236,.55)';
    const px=Math.random()*256,py=Math.random()*256;
    x.beginPath();x.ellipse(px,py,1+Math.random()*2.5,3+Math.random()*9,0,0,Math.PI*2);x.fill();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,20);
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}

const dotGeo=new THREE.SphereGeometry(.032,12,10);
// point on the front of an ellipsoid (centre c, radii r) at x,y
function onFace(c,r,x,y,out=.006){
  const k=1-(x/r[0])**2-(y/r[1])**2;
  return new THREE.Vector3(c[0]+x,c[1]+y,c[2]+r[2]*Math.sqrt(Math.max(0,k))+out);
}
function addEyes(g,c,r,dx,dy,size=1){
  [-dx,dx].forEach(x=>{const e=mesh(dotGeo,P.eye,false);e.scale.setScalar(size);e.scale.y*=1.15;
    e.position.copy(onFace(c,r,x,dy));g.add(e);});
}
function addSquiggle(g,c,r,w,dy,amp=.04){
  // lowercase "m": starts at the bottom, up, down, up, back to the bottom
  const pts=[];for(let i=0;i<=32;i++){const u=i/32,x=-w/2+w*u;pts.push(onFace(c,r,x,dy-amp/2+Math.abs(Math.sin(u*Math.PI*2))*amp,.004));}
  const m=mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),48,.011,6,false),P.eye,false);g.add(m);
}

function makeFish(x,y,z){
  const g=new THREE.Group();
  const b=mesh(G.fishBody,M.fish);b.scale.set(1.5,.85,.5);g.add(b);
  const belly=mesh(G.fishBody,M.fishBelly,false);belly.scale.set(1.2,.5,.45);belly.position.y=-.1;g.add(belly);
  const t=mesh(G.fishTail,M.fish);t.rotation.z=Math.PI/2;t.position.x=-.5;g.add(t);
  const e=mesh(G.dot,M.coal,false);e.position.set(.28,.07,.13);g.add(e);
  g.position.set(x,y,z);g.userData.baseY=y;g.userData.phase=Math.random()*6;
  scene.add(g);fishes.push(g);
}

function spawnRow(z){
  const order=[0,1,2].sort(()=>Math.random()-.5);
  const hardness=Math.min(1,(speed-14)/16);
  const n=Math.random()<.35+hardness*.35?2:1;
  for(let i=0;i<n;i++){
    const lane=order[i];
    const tallChance=.25+hardness*.25;
    const pool=Math.random()<tallChance?HIGH:LOW;
    const k=KINDS[pool[Math.floor(Math.random()*pool.length)]]();
    k.obj.position.set(LANES[lane],0,z);k.lane=lane;
    scene.add(k.obj);obstacles.push(k);
    if(!k.tall&&Math.random()<.3){for(let j=-1;j<=1;j++)makeFish(LANES[lane],2.2-Math.abs(j)*.35,z+j*1.6);}
  }
  if(Math.random()<.55){const lane=order[n];for(let j=0;j<4;j++)makeFish(LANES[lane],.75,z-3-j*2.2);}
}

const SPRAY=90;
const sprayGeo=new THREE.BufferGeometry();
const sprayPos=new Float32Array(SPRAY*3);
sprayGeo.setAttribute('position',new THREE.BufferAttribute(sprayPos,3));
const spray=new THREE.Points(sprayGeo,new THREE.PointsMaterial({color:0xffffff,size:.16,transparent:true,opacity:.9}));
spray.frustumCulled=false;scene.add(spray);
const sprayP=Array.from({length:SPRAY},()=>({life:0,v:[0,0,0]}));
let sprayIdx=0;
for(let i=0;i<SPRAY;i++)sprayPos[i*3+1]=-5;
function emitSpray(x){
  const p=sprayP[sprayIdx];sprayIdx=(sprayIdx+1)%SPRAY;
  p.life=.45;p.v=[(Math.random()-.5)*3,1.5+Math.random()*2.5,3+Math.random()*3];
  const i=sprayP.indexOf(p)*3;
  sprayPos[i]=x+(Math.random()-.5)*1.2;sprayPos[i+1]=.1;sprayPos[i+2]=1.4;
}

  setTimeout(()=>{const b=document.querySelector('#skins .skin[aria-checked="true"]');b&&b.focus({preventScroll:true});},50);
}
function renderShop(){renderSkins();renderHats();$('bankN').textContent=bank;updateBuyBtn();}
function updateBuyBtn(){
  const btn=$('shopPlay');
  if(!preview){btn.className='go';btn.innerHTML='Play';btn.removeAttribute('aria-disabled');return;}
  const p=PRICE[preview.kind+':'+preview.id];
  if(bank>=p){btn.className='go';btn.innerHTML='Buy for '+p+' fish';btn.removeAttribute('aria-disabled');}
  else{btn.className='go cant';btn.innerHTML='Need '+(p-bank)+' more fish';btn.setAttribute('aria-disabled','true');}
}
function choose(kind,id){
  const key=kind+':'+id;
  if(isOwned(key)){
    preview=null;
    if(kind==='skin'){skin=id;try{localStorage.setItem('filda-skin',id);}catch(e){}}
    else{hat=id;try{localStorage.setItem('filda-hat',id);}catch(e){}}
  }else preview={kind,id};
  applySkin(shown('skin'));applyHat(shown('hat'));waveT=1.6;
  renderShop();
  const b=document.querySelector('#'+(kind==='skin'?'skins':'hats')+' [data-id="'+id+'"]');b&&b.focus({preventScroll:true});
}
function buy(){
  if(!preview)return false;
  const key=preview.kind+':'+preview.id,p=PRICE[key];
  if(bank<p)return true;
  bank-=p;saveBank();owned.add(key);saveOwned();
  const {kind,id}=preview;preview=null;choose(kind,id);
  const bk=$('bank');bk.classList.remove('pop');void bk.offsetWidth;bk.classList.add('pop');
  return true;
}
function tagFor(kind,id,fallback){
  const on=shown(kind)===id,key=kind+':'+id;
  if(!isOwned(key))return `<span class="price">${FISH_SVG}${PRICE[key]}</span>`;
  return on?'Selected':fallback;
}
function renderSkins(){
  const hex=n=>'#'+n.toString(16).padStart(6,'0'),cur=shown('skin');
  $('skins').innerHTML=Object.entries(SKINS).map(([id,k])=>{
    const on=id===cur,lock=!isOwned('skin:'+id);
    return `<button class="skin${lock?' locked':''}" type="button" role="radio" aria-checked="${on}" data-id="${id}" tabindex="${on?0:-1}" aria-label="${k.name}${lock?', costs '+PRICE['skin:'+id]+' fish':''}">
      <span class="mini" style="--w:${hex(k.head)};--c:${hex(k.cap)};--a:${hex(k.arms)};--b:${hex(k.beak)};--t:${hex(k.torso)};--li:${hex(k.legIn)};--lo:${hex(k.legOut)}" aria-hidden="true">
        <i class="ar l"></i><i class="ar r"></i><i class="lg l"></i><i class="lg r"></i><i class="bd"></i>${k.oval!=null?`<i class="ov" style="--o:${hex(k.oval)}"></i>`:''}<i class="hd"></i>
      </span>
      <span class="nm">${k.name}</span><span class="tag">${tagFor('skin',id,k.tag)}</span></button>`;
  }).join('');
}
function renderHats(){
  const cur=shown('hat');
  $('hats').innerHTML=Object.entries(HATS).map(([id,h])=>{
    const on=id===cur,lock=!isOwned('hat:'+id);
    return `<button class="skin hat${lock?' locked':''}" type="button" role="radio" aria-checked="${on}" data-id="${id}" tabindex="${on?0:-1}" aria-label="${h.name}${lock?', costs '+PRICE['hat:'+id]+' fish':''}">
      <svg viewBox="0 0 40 40" aria-hidden="true">${HAT_ICONS[id]}</svg><span class="nm">${h.name}</span><span class="tag">${lock?tagFor('hat',id,''):''}</span></button>`;
  }).join('');
}
function radioKeys(el,kind,list){
  el.addEventListener('keydown',e=>{
    const ids=Object.keys(list),i=ids.indexOf(shown(kind));
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){choose(kind,ids[(i+1)%ids.length]);e.preventDefault();}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){choose(kind,ids[(i+ids.length-1)%ids.length]);e.preventDefault();}
  });
}
$('skins').addEventListener('click',e=>{const b=e.target.closest('.skin');if(b)choose('skin',b.dataset.id);});
$('hats').addEventListener('click',e=>{const b=e.target.closest('.hat');if(b)choose('hat',b.dataset.id);});
radioKeys($('skins'),'skin',SKINS);radioKeys($('hats'),'hat',HATS);
function startGame(){
  clearWorld();resetPose();endPreview();
  state='intro';introT=0;speed=0;dist=0;fishCount=0;sinceRow=8;
  show(null);
  $('dist').textContent='0';$('fish').textContent='0';
}
function continueRun(){
  // clear the stretch right ahead, put Filda back on his belly, and give a moment of safety
  for(let i=obstacles.length-1;i>=0;i--){if(obstacles[i].obj.position.z>-40){scene.remove(obstacles[i].obj);obstacles.splice(i,1);}}
  // keep the half-turn from the intro so he faces down the slope, belly down
  player.rotation.set(0,0,0);rig.rotation.set(0,Math.PI,0);pose.rotation.set(Math.PI/2,0,0);
  py=BASE_Y;vy=0;grounded=true;sinceRow=0;
  state='play';speed=Math.max(14,runSpeed*.85);invuln=2;
  show(null);
}
function beginSlide(){
  state='play';speed=14;sinceRow=8;
  if(!hintShown){hintShown=true;const h=$('hint');h.hidden=false;h.style.opacity='1';
    setTimeout(()=>{h.style.opacity='0';setTimeout(()=>h.hidden=true,700);},3200);}
}
function crash(){
  runSpeed=speed;state='crash';crashT=0;vy=6;grounded=false;shake=.5;
}
function showOver(){
  state='over';
  const m=Math.floor(dist/2);
  const isBest=m>best;if(isBest){best=m;try{localStorage.setItem('filda-best',String(best));}catch(e){}}
  $('overTitle').textContent=SKINS[skin].name+' wiped out';
  $('oDist').textContent=m;$('oFish').textContent=fishCount;$('oBest').textContent=best;$('oBank').textContent=bank;
  $('newBest').hidden=!isBest;show('over');
  setTimeout(()=>$('againBtn').focus({preventScroll:true}),50);
}
$('startBtn').addEventListener('click',startGame);
$('shopPlay').addEventListener('click',()=>{if(!buy())startGame();});
$('shopBtn').addEventListener('click',openShop);
$('shopBack').addEventListener('click',goHome);
$('againBtn').addEventListener('click',continueRun);
$('homeBtn').addEventListener('click',goHome);
updateHome();

/* ---------- music ---------- */
// Played through Web Audio so the loop is sample-exact (an <audio loop> tag leaves a gap at the seam).
const musicBtn=$('musicBtn');
const MUSIC_VOL=.35,LOOP_SECONDS=80; // aurora is exactly 80 s and loops seamlessly
let musicOn=true;try{musicOn=localStorage.getItem('filda-music')!=='off';}catch(e){}
let actx=null,gain=null,src=null,buf=null,loading=null,fallback=null;
function pickFile(){
  const t=document.createElement('audio');
  return t.canPlayType('audio/ogg; codecs="vorbis"')?'audio/aurora.ogg':'audio/aurora.mp3';
}
function loadMusic(){
  if(loading)return loading;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){loading=Promise.reject();return loading;}
  actx=new AC();gain=actx.createGain();gain.gain.value=0;gain.connect(actx.destination);
  loading=fetch(pickFile()).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();})
    .then(ab=>new Promise((ok,no)=>actx.decodeAudioData(ab,ok,no)))
    .then(b=>{buf=b;});
  return loading;
}
function startSource(){
  if(src||!buf)return;
  src=actx.createBufferSource();src.buffer=buf;src.loop=true;
  // if the decoder kept encoder padding, skip it so the loop stays exactly 80 s
  const extra=buf.duration-LOOP_SECONDS;
  if(extra>.002){src.loopStart=Math.min(extra,1105/buf.sampleRate);src.loopEnd=src.loopStart+LOOP_SECONDS;}
  src.connect(gain);src.start(0,src.loopStart||0);
}
// last resort (e.g. page opened straight from disk, where fetch is blocked): plain audio tag
function useFallback(){
  if(!fallback){fallback=new Audio(pickFile());fallback.loop=true;fallback.volume=MUSIC_VOL;}
  return fallback;
}
function playMusic(){
  if(!musicOn||document.hidden)return;
  loadMusic().then(()=>{
    if(!musicOn||document.hidden)return;
    if(actx.state!=='running')actx.resume();
    startSource();
    const g=gain.gain,now=actx.currentTime;
    g.cancelScheduledValues(now);g.setValueAtTime(g.value,now);g.linearRampToValueAtTime(MUSIC_VOL,now+.9);
  }).catch(()=>{const p=useFallback().play();if(p&&p.catch)p.catch(()=>{});});
}
function stopMusic(ms){
  if(fallback){fallback.pause();}
  if(!actx||!gain)return;
  const g=gain.gain,now=actx.currentTime;
  g.cancelScheduledValues(now);g.setValueAtTime(g.value,now);g.linearRampToValueAtTime(0,now+ms/1000);
  setTimeout(()=>{if((!musicOn||document.hidden)&&actx.state==='running')actx.suspend();},ms+50);
}
function syncMusicBtn(){musicBtn.setAttribute('aria-pressed',String(musicOn));musicBtn.setAttribute('aria-label',musicOn?'Mute music':'Play music');}
function toggleMusic(){
  musicOn=!musicOn;try{localStorage.setItem('filda-music',musicOn?'on':'off');}catch(e){}
  syncMusicBtn();if(musicOn)playMusic();else stopMusic(300);
}
syncMusicBtn();
musicBtn.addEventListener('click',()=>{toggleMusic();musicBtn.blur();});
// browsers only allow sound after the player interacts, so start on the first tap or key
function firstTouch(){playMusic();window.removeEventListener('pointerdown',firstTouch,true);window.removeEventListener('keydown',firstTouch,true);}
window.addEventListener('pointerdown',firstTouch,true);window.addEventListener('keydown',firstTouch,true);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMusic(150);else playMusic();});
window.addEventListener('keydown',e=>{if((e.key==='m'||e.key==='M')&&!e.repeat)toggleMusic();});

/* ---------- input ---------- */
function steer(d){if(state!=='play')return;lane=Math.max(0,Math.min(2,lane+d));}
function jump(){if(state!=='play'||!grounded)return;vy=9.6;grounded=false;}
let touch=null;
host.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY,t:performance.now(),done:false};});
host.addEventListener('pointermove',e=>{
  if(!touch||touch.done)return;
  const dx=e.clientX-touch.x,dy=e.clientY-touch.y;
  // short swipes count; keep dragging to hop another lane
  const need=touch.moved?52:28;
  if(Math.abs(dx)>need&&Math.abs(dx)>Math.abs(dy)*.8){
    steer(dx>0?1:-1);touch.moved=true;touch.x=e.clientX;touch.y=e.clientY;
  }else if(!touch.moved&&dy<-30&&Math.abs(dy)>Math.abs(dx)){
    jump();touch.done=true;
  }
});
host.addEventListener('pointerup',()=>{
  if(touch&&!touch.done&&!touch.moved&&performance.now()-touch.t<300)jump();touch=null;
});
host.addEventListener('pointercancel',()=>{touch=null;});
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){steer(-1);e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'||k==='D'){steer(1);e.preventDefault();}
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' '){
    if(state==='play'){jump();e.preventDefault();}
  }
});

/* ---------- loop ---------- */
const clock=new THREE.Clock();
function update(dt){
  t+=dt;
  if(state==='play'){speed=Math.min(34,speed+.2*dt);dist+=speed*dt;}
  else if(state==='menu'||state==='shop'||state==='intro')speed=0;
  else speed=Math.max(0,speed-30*dt);
  const move=speed*dt;

  snowTex.offset.y+=move/10;

  for(const d of decor){d.position.z+=move;if(d.position.z>14){d.position.z-=120;d.position.x=(Math.random()<.5?-1:1)*(5.2+Math.random()*12);}}

  if(state==='play'){
    sinceRow+=move;
    const gap=11+speed*.25;
    if(sinceRow>gap){sinceRow=0;spawnRow(-96);}
  }
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.obj.position.z+=move;
    if(o.roll)o.roll.rotation.x+=move/.55;
    if(o.obj.position.z>14){scene.remove(o.obj);obstacles.splice(i,1);}
  }
  for(let i=fishes.length-1;i>=0;i--){
    const f=fishes[i];f.position.z+=move;
    f.rotation.y+=dt*3;f.position.y=f.userData.baseY+Math.sin(t*4+f.userData.phase)*.1;
    if(state==='play'&&Math.abs(f.position.z)<1.3&&Math.abs(f.position.x-px)<1&&Math.abs(f.position.y-(py+.2))<1.1){
      scene.remove(f);fishes.splice(i,1);fishCount++;bank++;saveBank();$('fish').textContent=fishCount;continue;
    }
    if(f.position.z>14){scene.remove(f);fishes.splice(i,1);}
  }

  // player physics
  const tx=LANES[lane];
  px+=(tx-px)*Math.min(1,dt*24);
  const idle=state==='menu'||state==='shop';
  if(idle||state==='intro'){
    let turn=0,flop=0,wave=0,hop=0;
    if(idle&&waveT>0){waveT=Math.max(0,waveT-dt);wave=waveT>1.3?ease((1.6-waveT)/.3):waveT<.3?ease(waveT/.3):1;}
    if(state==='intro'){
      introT+=dt;const T=introT;
      wave=T<.3?ease(T/.3):T<1.7?1:T<2?1-ease((T-1.7)/.3):0;
      turn=T<2?0:T<2.5?ease((T-2)/.5):1;
      hop=(T>2&&T<2.5)?Math.sin((T-2)/.5*Math.PI)*.35:0;
      flop=T<2.5?0:T<2.9?ease((T-2.5)/.4):1;
      if(T>=2.9)beginSlide();
    }
    rig.rotation.y=turn*Math.PI;
    rig.rotation.z=Math.sin(t*9)*.05*wave;
    pose.rotation.x=flop*Math.PI/2;
    py=STAND_Y+(BASE_Y-STAND_Y)*flop+hop+(idle?Math.abs(Math.sin(t*2.4))*.07:0);
    headPivot.rotation.x=-1.12*flop;
    headPivot.rotation.z=Math.sin(t*5)*.14*wave;
    arms[0].rotation.z=-ARM_SPLAY;
    arms[1].rotation.z=ARM_SPLAY+wave*(2.25+Math.sin(t*14)*.4);
    vy=0;grounded=true;
    player.position.set(px,py,0);
  }else{
    vy-=28*dt;py+=vy*dt;
    if(py<=BASE_Y){py=BASE_Y;vy=0;grounded=true;}
    player.position.set(px,py,0);
    rig.rotation.z=(px-tx)*.18;
    headPivot.rotation.x=-1.12+Math.sin(t*7)*.04;
    headPivot.rotation.z=0;
    const flap=grounded?0:Math.sin(t*22)*.55;
    arms[0].rotation.z=-ARM_SPLAY-Math.max(0,flap);arms[1].rotation.z=ARM_SPLAY+Math.max(0,flap);
  }

  if(state==='crash'){
    crashT+=dt;player.rotation.x+=dt*9;player.rotation.z+=dt*4;
    if(crashT>1)showOver();
  }

  if(invuln>0){invuln=Math.max(0,invuln-dt);player.visible=invuln===0||Math.floor(t*12)%2===0;}
  if(state==='play'){
    $('dist').textContent=Math.floor(dist/2);
    const bottom=py-.4;
    if(invuln<=0)for(const o of obstacles){
      if(Math.abs(o.obj.position.z+.1)<o.d/2+1.1&&Math.abs(o.obj.position.x-px)<1.15){
        if(o.tall||bottom<o.h-.15){crash();break;}
      }
    }
  }

  // spray
  if(grounded&&state==='play')for(let i=0;i<2;i++)emitSpray(px);
  for(let i=0;i<SPRAY;i++){
    const p=sprayP[i];
    if(p.life>0){p.life-=dt;const j=i*3;
      sprayPos[j]+=p.v[0]*dt;sprayPos[j+1]+=p.v[1]*dt;sprayPos[j+2]+=p.v[2]*dt;p.v[1]-=9*dt;
      if(p.life<=0)sprayPos[j+1]=-5;}
  }
  sprayGeo.attributes.position.needsUpdate=true;

  // camera
  shake=Math.max(0,shake-dt);
  const sx=(Math.random()-.5)*shake*.6,sy=(Math.random()-.5)*shake*.6;
  // close-up while Filda waves, pull back as he turns to slide
  const zoomTarget=(idle||(state==='intro'&&introT<2))?1:0;
  camZoom+=(zoomTarget-camZoom)*Math.min(1,dt*3);
  // close-up is eye-level and straight-on, like the reference picture
  const near=camera.aspect<0.8?{y:1.75,z:6}:{y:1.75,z:5.2};
  // in the shop the card is taller, so frame Filda higher up the screen
  shopLift+=((state==='shop'?1:0)-shopLift)*Math.min(1,dt*4);
  const L=(a,b)=>a+(b-a)*camZoom;
  camera.position.set(px*.55+sx,L(camBase.y,near.y)+sy,L(camBase.z,near.z));
  camera.lookAt(px*.35,L(camBase.ly,1.5-1.25*shopLift),L(camBase.lz,0));
  sun.position.set(px+7,14,8);sun.target.position.set(px,0,-6);
}
function frame(){
  const dt=Math.min(.05,clock.getDelta());
  update(dt);renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
